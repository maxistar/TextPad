name: Promote Android Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable v<versionName> release tag
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Verify tag and derive versionCode
        id: identity
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch origin --tags
          test "$(git cat-file -t "$TAG")" = "tag"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          python3 scripts/release_tool.py metadata > release-metadata.json
          test "$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["tag"])')" = "$TAG"
          echo "version_code=$(python3 -c 'import json; print(json.load(open("release-metadata.json"))["versionCode"])')" >> "$GITHUB_OUTPUT"
      - name: Decode Google Play service account
        env:
          SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode > service-account.json
      - name: Require the exact version on internal
        run: >-
          bundle exec fastlane android assert_track_version_code
          version_code:${{ steps.identity.outputs.version_code }} track:internal
          json_key:${{ github.workspace }}/service-account.json
      - name: Promote existing internal artifact to completed production
        run: >-
          bundle exec fastlane android promote_release
          version_code:${{ steps.identity.outputs.version_code }}
          json_key:${{ github.workspace }}/service-account.json
