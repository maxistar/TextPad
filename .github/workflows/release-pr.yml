name: Validate Android Release PR

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Validate release identity and localized notes
        run: python3 scripts/release_tool.py validate
      - name: Test release tooling
        run: python3 -m unittest scripts/test_release_tool.py
      - name: Test, lint, and assemble release outputs
        run: ./gradlew test lint assembleRelease bundleRelease --no-daemon
      - name: Verify assembled release identity
        run: >-
          python3 scripts/release_tool.py verify-build
          --manifest app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          --metadata app/build/intermediates/merged_manifests/release/processReleaseManifest/output-metadata.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-pr-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/release/
            app/build/outputs/bundle/release/
          retention-days: 14
