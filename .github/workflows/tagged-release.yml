name: Publish Tagged Android Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Resolve requested tag
        id: requested
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_call" ]; then TAG="$INPUT_TAG"; else TAG="$REF_TAG"; fi
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) exit 2 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.requested.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.6
          bundler-cache: true
      - name: Verify tag and release identity
        env:
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          git fetch origin --tags
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          test "$(git cat-file -t "$TAG")" = "tag"
          test "$(python3 scripts/release_tool.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')" = "$TAG"
          python3 scripts/release_tool.py validate --skip-branch --allow-existing-tag
      - name: Detect an existing complete GitHub Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --dir release-artifacts
            (cd release-artifacts && sha256sum --check SHA256SUMS)
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode Android keystore
        if: steps.existing.outputs.complete != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-keystore.jks
      - name: Build signed APK and AAB once
        if: steps.existing.outputs.complete != 'true'
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/android-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          ./gradlew clean test lint assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/TextPad-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/TextPad-$TAG.aab"
          (cd release-artifacts && sha256sum "TextPad-$TAG.apk" "TextPad-$TAG.aab" > SHA256SUMS)
          (cd release-artifacts && sha256sum --check SHA256SUMS)
      - name: Publish GitHub Release and immutable assets
        if: steps.existing.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          CODE=$(python3 scripts/release_tool.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
          NOTES="fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          gh release create "$TAG" release-artifacts/* --verify-tag --title "$TAG" --notes-file "$NOTES"
      - name: Decode Google Play service account
        env:
          SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: printf '%s' "$SERVICE_ACCOUNT_BASE64" | base64 --decode > service-account.json
      - name: Upload the published AAB to Play internal
        env:
          TAG: ${{ steps.requested.outputs.tag }}
        run: |
          CODE=$(python3 scripts/release_tool.py metadata | python3 -c 'import json,sys; print(json.load(sys.stdin)["versionCode"])')
          bundle exec fastlane android upload_release \
            apk:${{ github.workspace }}/release-artifacts/TextPad-$TAG.apk \
            aab:${{ github.workspace }}/release-artifacts/TextPad-$TAG.aab \
            version_code:$CODE \
            metadata_path:${{ github.workspace }}/fastlane/metadata/android \
            json_key:${{ github.workspace }}/service-account.json \
            track:internal
